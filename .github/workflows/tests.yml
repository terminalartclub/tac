name: tests

on:
  push:
    branches: [main]
  pull_request:
    paths: ["plugins/**", "tools/**", "tests/**"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          python -m pip install --disable-pip-version-check pytest "rich>=13" "Pillow>=10" "fonttools>=4"
      - run: python -m pytest -q
