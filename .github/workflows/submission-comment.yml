# Posts the submission check summary on the PR. Triggered by workflow_run so it runs in the base
# repo's context with a write token, but it NEVER checks out or runs PR code: it only reads the
# artifact (untrusted data) and posts it inside a code fence.
name: submission-comment

on:
  workflow_run:
    workflows: [submission]
    types: [completed]

permissions:
  actions: read          # download the artifact from the triggering run
  pull-requests: write   # comment on the PR

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: submission
          path: art
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          pr="$(head -c 16 art/pr-number.txt | tr -dc '0-9')"
          [ -n "$pr" ] || { echo "no PR number in artifact"; exit 1; }
          # The artifact is attacker-controlled: only comment if that PR's head is the commit this run checked.
          head="$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)"
          [ "$head" = "$HEAD_SHA" ] || { echo "PR #$pr head $head != run head $HEAD_SHA; not commenting"; exit 0; }
          {
            echo "### submission check: $CONCLUSION"
            echo
            echo '```text'
            head -c 20000 art/summary.txt | sed 's/```/ʼʼʼ/g'
            echo
            echo '```'
            echo
            echo "Previews (preview.webp, og.jpg, stats.json per piece) are in the \`submission\` artifact: $RUN_URL"
          } > body.md
          gh pr comment "$pr" --repo "$REPO" --body-file body.md
