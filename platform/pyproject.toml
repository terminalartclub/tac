[project]
name = "tac-platform"
version = "0.1.0"
description = "spare cycles: the Terminal Art Club community gallery API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "aiofiles>=24.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "anthropic>=1.11",
    "pillow>=11.0",
    "rich>=13.7",
    "fonttools>=4.50",
]

[project.scripts]
tac-platform = "tac_platform.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tac_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
